<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Roast Nomad">
  <title>Roast Nomad</title>

  <!-- Black square background (common favicon shape) -->
  <rect width="100" height="100" fill="#000000" rx="12"/>

  <!-- Coffee bean — white, centered, filling most of the icon area -->
  <ellipse cx="50" cy="50" rx="24" ry="33" fill="#ffffff"/>

  <!-- Bean center groove -->
  <path d="M 50 19 C 44 31, 56 44, 50 81" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
